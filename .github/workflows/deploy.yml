name: Deploy

# Runs deploy/hetzner/update.sh on the server after a new image is built
# (or the deployment files change). The SSH key is restricted on the server
# to that one command (see bootstrap.sh), so it cannot open a shell.
#
# Secrets (printed by bootstrap.sh): DEPLOY_HOST, DEPLOY_KNOWN_HOSTS, DEPLOY_SSH_KEY
on:
  workflow_run:
    workflows: [Home Image]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'deploy/hetzner/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run update.sh on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice::Deploy secrets not set yet - skipping."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST"
